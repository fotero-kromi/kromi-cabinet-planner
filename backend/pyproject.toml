# The new app's back end (docs/Rewrite_Decision.md). It imports the shared
# engine from the repository root and never the Streamlit app, its db/ package
# or SQLite (tests/test_boundaries.py).

[project]
name = "kromi-api"
description = "Kromi Cabinet Planner: FastAPI back end around the shared planning engine"
requires-python = ">=3.11"
dynamic = ["version"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ for kromi_api, the repository root for engine/ and tools/
pythonpath = [".", ".."]
addopts = ["-ra", "--strict-markers", "--strict-config", "-q"]
# Every warning is an error, so deprecations are fixed when they appear.
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kromi_api", "engine", "tools"]

[tool.mypy]
python_version = "3.11"
files = ["kromi_api"]
mypy_path = ".."
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

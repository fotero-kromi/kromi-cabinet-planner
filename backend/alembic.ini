# Alembic (database migrations) for the new app. The database URL comes from
# KROMI_DATABASE_URL (see kromi_api/config.py); tests set it explicitly.
#   cd backend && alembic upgrade head

[alembic]
script_location = %(here)s/kromi_api/migrations
prepend_sys_path = %(here)s:%(here)s/..
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

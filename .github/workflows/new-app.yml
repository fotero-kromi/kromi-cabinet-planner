name: New app

# The FastAPI + React rewrite (docs/Rewrite_Decision.md). The Streamlit app's
# gate keeps running on this branch in ci.yml.
on:
  push:
    branches: [rewrite/fastapi-react]
  pull_request:
    branches: [rewrite/fastapi-react]

jobs:
  backend:
    name: Back end (Python 3.12, PostgreSQL 18)
    runs-on: ubuntu-latest

    # A real PostgreSQL service for every test. Major version 18 (the tag
    # follows its newest minor release); the Docker setup uses the same tag.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kromi
          POSTGRES_PASSWORD: kromi
          POSTGRES_DB: kromi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kromi -d kromi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      KROMI_TEST_DATABASE_URL: postgresql+psycopg://kromi:kromi@127.0.0.1:5432/kromi_test
      KROMI_EXPECT_POSTGRES_MAJOR: "18"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy

      # Includes the parity oracle (the synthetic scenarios must match the
      # Streamlit app's manifest), the PostgreSQL round trip and the migrations.
      - name: Tests (pytest)
        run: pytest

  frontend:
    name: Front end (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      # The back-end tests check openapi.json against the served schema; this
      # step checks that the committed client was generated from that file.
      - name: Generated API client is current
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (TypeScript)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: Docker setup, end to end in a browser
    runs-on: ubuntu-latest
    env:
      KROMI_E2E_URL: http://127.0.0.1:8080

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Exactly as the owner starts it: one command, port 8080 on this machine.
      - name: Build and start the app (docker compose)
        run: docker compose up -d --build --wait

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install the browser test
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium

      # The synthetic standard scenario through the screens; the downloaded
      # workbook must have the Streamlit app's digest.
      - name: Browser test (pytest e2e)
        run: python -m pytest e2e -p no:cacheprovider

      - name: The data survives a restart
        run: |
          docker compose down
          docker compose up -d --wait
          python -c "import json, urllib.request; runs = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v1/runs')); assert runs and runs[0]['status'] == 'succeeded', runs; print(len(runs), 'run(s) kept')"

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/artifacts/
          if-no-files-found: ignore

      - name: Stop and remove everything
        if: always()
        run: docker compose down -v

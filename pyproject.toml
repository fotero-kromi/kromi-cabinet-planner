[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Make the engine package importable without installing the project.
# pytest rootdir resolves to kromi_app/, which contains engine/.
pythonpath = ["."]

# Output formatting
addopts = [
    "-ra",            # show a summary of all non-passing tests
    "--strict-markers",
    "--strict-config",
    "-q",
]

markers = [
    "slow: tests that take more than 1 second",
    "integration: tests that read fixture files from disk",
]


[tool.ruff]
# Target the Python version the app runs on.
target-version = "py310"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# A pragmatic, meaningful rule set:
#   E/W  pycodestyle errors/warnings
#   F    pyflakes (real bugs: undefined names, unused vars)
#   I    import sorting
#   UP   pyupgrade (modern syntax)
#   B    flake8-bugbear (likely bugs)
select = ["E", "W", "F", "I", "UP", "B"]

# Line-length is enforced by the formatter, not the linter (avoids noise on
# wide-but-readable lines like import lists and tabular constant data).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The engine package __init__ re-exports the public API. Those imports are
# intentionally "unused" in the file itself -- they define what the package
# exposes. F401 (unused import) and F811 are expected here.
"engine/__init__.py" = ["F401", "F811"]
# Tests use bare asserts and occasionally import pytest only for markers.
"tests/*" = ["F401", "B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.mypy]
python_version = "3.10"
# Type-check the engine only. The Streamlit pages interact heavily with
# dynamically-typed third-party UI objects, where strict typing adds noise
# without catching real bugs.
files = ["engine", "db", "app_log.py"]
ignore_missing_imports = true       # pandas/openpyxl/etc. ship partial stubs
warn_unused_ignores = true
warn_redundant_casts = true
# Pragmatic strictness: catch real type errors without requiring a full
# annotation pass on every local variable.
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
disallow_untyped_defs = false
